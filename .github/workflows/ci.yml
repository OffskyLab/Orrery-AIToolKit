name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # This package promises strict Swift 6 concurrency with no escape
      # hatches. A promise nothing checks is a promise that decays, so the
      # check lives here rather than in whoever remembers to run it.
      - name: Build under complete concurrency checking, warnings as errors
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      # `@unchecked Sendable`, `@preconcurrency` and `nonisolated(unsafe)` are
      # banned outright. The compiler cannot enforce that — they are legal
      # Swift — so grep does. Doc comments explaining why an escape hatch is
      # NOT used are legitimate and must not trip this, hence the match on
      # attribute syntax at the start of a line's code rather than anywhere in
      # the file.
      - name: Reject concurrency escape hatches
        run: |
          if grep -rnE '^[^/]*(@unchecked[[:space:]]+Sendable|@preconcurrency|nonisolated\(unsafe\))' Sources Tests; then
            echo "::error::A concurrency escape hatch reached the source. This package does not use them."
            exit 1
          fi
          echo "No escape hatches found."

  # macos-latest never catches a Linux-only build break: Foundation
  # re-exports Darwin and Dispatch on Apple platforms but not on Linux, so
  # code that leans on that re-export (`read(2)`, `errno`, `DispatchQueue`)
  # compiles here and nowhere else. The only Linux build in the whole
  # system used to be orrery's release workflow, which runs at tag push —
  # discovering a break there means discovering it at release time. This
  # job moves that discovery to every PR instead.
  build-and-test-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test
